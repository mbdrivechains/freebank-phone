# app.ecxfreebank.com: the FreeBank phone page and relay, proxied to fb-relay on 127.0.0.1:8480.
# Installed as /etc/nginx/sites-available/fb-app beside the server's other sites, which it does not change.
# Two stages: stage 1 is this file without the #HTTPS# lines (ACME and a redirect); stage 2, once certbot has the
# certificate, is the whole file with the #HTTPS# prefixes removed.
#
# Privacy: nothing here passes a visitor's address to the relay, and the access log has no addresses, user agents,
# referrers or query strings (fragments, where the pairing code lives, never reach a server). The limits below key
# on the address in memory only. nginx's error log still names the client on real errors (the relay down, a body
# over 1 KiB); requests refused by the limits are logged at "info", below this site's error_log level, so they
# leave no address.

# Per visitor: new WebSocket connections, page loads, open connections. And the whole site's share of nginx's
# worker_connections, so a flood here can't starve ecxfreebank.com or the explorer.
limit_req_zone  $binary_remote_addr zone=fb_app_ws:10m    rate=2r/s;
limit_req_zone  $binary_remote_addr zone=fb_app_pages:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=fb_app_addr:10m;
limit_conn_zone $server_name        zone=fb_app_site:1m;
# "Send to FreeBank" reports: a burst of 5 per address, then one a minute (the relay caps the total as well).
limit_req_zone  $binary_remote_addr zone=fb_app_feedback:1m rate=1r/m;

# GET and HEAD everywhere; POST only to /feedback.
map "$request_method $uri" $fb_app_method_ok {
    default          0;
    "~^(GET|HEAD) "  1;
    "POST /feedback" 1;
}

map $http_upgrade $fb_app_connection {
    default upgrade;
    ''      close;
}

# The relay sends these headers on every response it makes (relay/src/lib.rs: CSP, PERMISSIONS_POLICY), and they
# pass through unchanged. nginx adds the same values only to responses it makes itself (redirects, 429, 405, 502),
# so there is one source for them: change the relay, not this file. (An empty value means add_header adds nothing.)
# One difference: nginx's own responses keep the camera off (camera=()); they are never the page, which may use it.
map $upstream_http_content_security_policy $fb_app_csp {
    ''      "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    default '';
}
map $upstream_http_x_content_type_options $fb_app_nosniff {
    ''      nosniff;
    default '';
}
map $upstream_http_referrer_policy $fb_app_referrer {
    ''      no-referrer;
    default '';
}
map $upstream_http_x_frame_options $fb_app_frame {
    ''      DENY;
    default '';
}
map $upstream_http_permissions_policy $fb_app_permissions {
    ''      "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), fullscreen=()";
    default '';
}
map $upstream_http_cross_origin_opener_policy $fb_app_coop {
    ''      same-origin;
    default '';
}
map $upstream_http_cross_origin_resource_policy $fb_app_corp {
    ''      same-origin;
    default '';
}

# Counts and statuses only.
log_format fb_app_noaddr '[$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name app.ecxfreebank.com;
    server_tokens off;
    access_log /var/log/nginx/fb-app.access.log fb_app_noaddr;

    # Let's Encrypt (certbot --webroot, the same webroot as the explorer's), also for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/fbx-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

