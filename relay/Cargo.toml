[package]
name = "fb-relay"
version = "0.1.0"
edition = "2021"
description = "FreeBank phone relay: a dumb WebSocket pipe plus a static file server for the phone page"
publish = false

[lib]
name = "fb_relay"
path = "src/lib.rs"

[[bin]]
name = "fb-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# The shipped binary: no symbols, and integer overflow is a (caught, per-connection) panic rather than a silent wrap.
strip = true
overflow-checks = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
